name: Rollback service
# Runbook: roll a service back to its previous (or a given) version.
# Fixes a BAD RELEASE. Started by the AIRA DevOps Agent only after a person approved.
on:
  workflow_dispatch:
    inputs:
      service: { description: "Service: orders-api | payments-api | web-frontend | reports-worker | auth-service (plain words like orders, payments, website, reports, login also work)", required: true, default: "orders-api" }
      version: { description: "Version to roll back to (empty = previous_version)", required: false, default: "" }
      reason:  { description: "Why (incident / approval reference)", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: demo-state, cancel-in-progress: false }
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Roll back
        env:
          IN_SERVICE: ${{ inputs.service }}
          IN_VERSION: ${{ inputs.version }}
          IN_REASON: ${{ inputs.reason }}
        run: |
          . scripts/svc.sh
          s=$(resolve "$IN_SERVICE"); f="state/$s.json"; cause=$(jq -r ".cause // \"\"" "$f")
          from=$(jq -r .version "$f"); to="$IN_VERSION"; [ -n "$to" ] || to=$(jq -r .previous_version "$f")
          echo "Rolling $s back: $from -> $to"; sleep 5
          jq --arg to "$to" --arg from "$from" '.version=$to | .previous_version=$from' "$f" > t && mv t "$f"
          if [ "$cause" = deploy ]; then
            jq '.status="healthy" | .cpu_percent=38 | .p95_latency_ms=310 | .error_rate_percent=0.2 | del(.cause)' "$f" > t && mv t "$f"
            note="Healthy again: the bad release is gone."
          else
            note="Rolled back, but the problem was not the release — still degraded."
          fi
          jq --arg now "$(date -u +%FT%TZ)" --arg a "rollback to $to${IN_REASON:+ ($IN_REASON)}" '.updated_at=$now | .last_action=$a' "$f" > t && mv t "$f"
          commit "Rollback $s $from -> $to"
          echo "$note"; { echo "### Rollback: $s $from → $to"; echo "$note"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
