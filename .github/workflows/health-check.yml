name: Health check
# Read-only: the current health of one service or all of them. Green = healthy, red = something is degraded.
# Safe to run any time (also before an approval) to find out what is broken.
on:
  workflow_dispatch:
    inputs:
      service: { description: "Service to check, or 'all'", required: false, default: "all" }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          IN_SERVICE: ${{ inputs.service }}
        run: |
          . scripts/svc.sh
          want="$IN_SERVICE"
          if [ -z "$want" ] || [ "$want" = all ]; then list=$SERVICES; else list=$(resolve "$want"); fi
          head="| service | version | status | CPU % | memory % | disk % | p95 ms | 5xx % | replicas | cert days |"
          echo "$head"; { echo "### Health"; echo "$head"; echo "|---|---|---|---|---|---|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          bad=""
          for s in $list; do
            row=$(health "$s") && ok=1 || ok=0
            echo "$row"; echo "$row" >> "$GITHUB_STEP_SUMMARY"
            [ $ok = 1 ] || bad="$bad $s"
          done
          if [ -n "$bad" ]; then
            for s in $bad; do echo "DEGRADED: $s — last action: $(jq -r .last_action state/$s.json)"; done
            echo; echo "**DEGRADED:$bad**" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "HEALTHY: all checked services"; echo; echo "**HEALTHY**" >> "$GITHUB_STEP_SUMMARY"
