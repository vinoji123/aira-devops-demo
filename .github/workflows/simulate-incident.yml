name: Simulate incident
# Demo: break one service the way real incidents happen (or reset everything), and optionally alert AIRA.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "What breaks"
        type: choice
        default: bad-deploy
        options: [bad-deploy, memory-leak, traffic-spike, disk-full, cert-expired, reset-all]
permissions:
  contents: write
concurrency: { group: demo-state, cancel-in-progress: false }
jobs:
  incident:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Break it
        id: br
        run: |
          . scripts/svc.sh
          now=$(date -u +%FT%TZ)
          set_state() { jq --arg now "$now" "$2 | .status=\"degraded\" | .updated_at=\$now" "state/$1.json" > t && mv t "state/$1.json"; }
          case "${{ inputs.scenario }}" in
            bad-deploy)    s=orders-api; set_state $s '.previous_version=(if .version=="v2.14.0" then .previous_version else .version end) | .version="v2.14.0" | .cause="deploy" | .cpu_percent=97 | .p95_latency_ms=2800 | .error_rate_percent=4.1 | .last_action="deploy v2.14.0"'
                           title="HighCPU and 5xx on orders-api after deploy v2.14.0" ;;
            memory-leak)   s=payments-api; set_state $s '.cause="memory" | .memory_percent=96 | .cpu_percent=64 | .p95_latency_ms=3200 | .error_rate_percent=2.5 | .uptime_days=9 | .last_action="running 9 days since last restart"'
                           title="payments-api memory at 96%, checkout timeouts" ;;
            traffic-spike) s=web-frontend; set_state $s '.cause="traffic" | .replicas=2 | .requests_per_second=2600 | .cpu_percent=98 | .p95_latency_ms=4100 | .error_rate_percent=1.8 | .last_action="marketing campaign: traffic x6"'
                           title="web-frontend CPU 98% on both replicas, traffic x6" ;;
            disk-full)     s=reports-worker; set_state $s '.cause="disk" | .disk_percent=99 | .queue_backlog=480 | .error_rate_percent=12 | .p95_latency_ms=9000 | .last_action="debug logging left on since v3.0.2"'
                           title="reports-worker disk 99% full, exports failing" ;;
            cert-expired)  s=auth-service; set_state $s '.cause="cert" | .cert_days_left=-1 | .error_rate_percent=100 | .p95_latency_ms=150 | .last_action="certificate auto-renewal failed"'
                           title="auth-service TLS certificate expired, logins failing" ;;
            reset-all)     s=all; for x in $SERVICES; do
                             jq --arg now "$now" '.status="healthy" | .cpu_percent=30 | .memory_percent=45 | .disk_percent=40 | .p95_latency_ms=300 | .error_rate_percent=0.1 | (if has("cert_days_left") then .cert_days_left=64 else . end) | (if has("queue_backlog") then .queue_backlog=0 else . end) | (if .service=="web-frontend" then .replicas=2 | .requests_per_second=400 else . end) | (if .service=="orders-api" and .version=="v2.14.0" then .version=.previous_version | .previous_version="v2.13.3" else . end) | del(.cause) | .updated_at=$now | .last_action="demo reset"' "state/$x.json" > t && mv t "state/$x.json"
                           done; title="" ;;
          esac
          GIT_AUTHOR=deploy-bot commit "Demo: ${{ inputs.scenario }}${s:+ ($s)}"
          echo "service=$s" >> "$GITHUB_OUTPUT"; echo "title=$title" >> "$GITHUB_OUTPUT"
          { echo "### ${{ inputs.scenario }}"; [ "$s" = all ] || { echo '```json'; cat "state/$s.json"; echo '```'; }; } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert AIRA (optional)
        if: inputs.scenario != 'reset-all'
        env:
          AIRA_ALERT_URL: ${{ secrets.AIRA_ALERT_URL }}
        run: |
          if [ -z "$AIRA_ALERT_URL" ]; then echo "No AIRA_ALERT_URL secret: skipped (report it by email instead)."; exit 0; fi
          curl -sf -X POST "$AIRA_ALERT_URL" -H 'Content-Type: application/json' -d "$(jq -n --arg t '${{ steps.br.outputs.title }}' --arg s '${{ steps.br.outputs.service }}' --arg repo "$GITHUB_REPOSITORY" \
            '{status:"firing", title:$t, alerts:[{status:"firing", labels:{alertname:$t, severity:"critical", service:$s, env:"production"}, annotations:{summary:$t, description:("Runbooks: GitHub Actions in "+$repo+"; state in state/"+$s+".json")}}]}')" || echo "AIRA not reachable from GitHub: skipped."
