name: Restart service
# Runbook: restart a service. Fixes a MEMORY LEAK / stuck process; does not fix a bad release or a full disk.
on:
  workflow_dispatch:
    inputs:
      service: { description: "Service: orders-api | payments-api | web-frontend | reports-worker | auth-service (plain words like orders, payments, website, reports, login also work)", required: true, default: "orders-api" }
      reason:  { description: "Why", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: demo-state, cancel-in-progress: false }
jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restart
        env:
          IN_SERVICE: ${{ inputs.service }}
          IN_REASON: ${{ inputs.reason }}
        run: |
          . scripts/svc.sh
          s=$(resolve "$IN_SERVICE"); f="state/$s.json"; cause=$(jq -r ".cause // \"\"" "$f")
          echo "Restarting $s"; sleep 5
          case "$cause" in
            memory) jq '.status="healthy" | .memory_percent=45 | .cpu_percent=30 | .p95_latency_ms=280 | .error_rate_percent=0.1 | .uptime_days=0 | del(.cause)' "$f" > t
                    note="Healthy again: memory freed by the restart." ;;
            deploy) jq '.cpu_percent=72 | .p95_latency_ms=900' "$f" > t
                    note="Restarted; CPU dropped for now but errors continue — the cause is the release." ;;
            *)      cp "$f" t; note="Restarted; nothing changed." ;;
          esac
          mv t "$f"
          jq --arg now "$(date -u +%FT%TZ)" '.updated_at=$now | .last_action="restart"' "$f" > t && mv t "$f"
          commit "Restart $s"
          echo "$note"; { echo "### Restart: $s"; echo "$note"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
