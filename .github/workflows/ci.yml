name: CI tests
# The app's tests: on every push and pull request (a fix PR shows green or red here).
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pytest
      - name: Tests
        run: python -m pytest -q
